<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fernhollow</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 48% 40% at 50% 52%,rgba(0,0,0,.42),transparent 72%);pointer-events:none}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap}
.hero,.corner,header{text-shadow:0 1px 18px rgba(0,0,0,.45)}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{left:20px;right:20px;bottom:30px;justify-content:center;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</head>
<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container"></div></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="Fernhollow">Fernhollow</a>
    <nav aria-label="Main"><a href="#">Work</a><a href="#">About</a><a href="#">Journal</a><a class="pill" href="#">Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Grown, not built.</h1>
    <p class="cap">Rooted in nature.<br>Built for what’s next.</p>
    <a class="go" href="#" id="go" aria-label="See our work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const ui = $('ui'), loader = $('loader');
const revealUI = () => ui.classList.add('on');
const MOBILE = matchMedia('(max-width:820px)').matches || matchMedia('(pointer:coarse)').matches;
const REDUCE = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------------- Ambient audio (procedural, starts muted) ---------------- */
class Ambient {
  constructor(){ this.ctx = null; this.muted = true; }
  init(){
    if (this.ctx) return;
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = ctx.createGain(); this.master.gain.value = 0;
    this.lp = ctx.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 16000; this.lp.Q.value = .7;
    this.lp.connect(this.master); this.master.connect(ctx.destination);
    // reverb-ish feedback delay
    const dly = ctx.createDelay(2), fb = ctx.createGain(), wet = ctx.createGain();
    dly.delayTime.value = .42; fb.gain.value = .45; wet.gain.value = .35;
    dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(this.lp);
    this.fx = dly;
    // pad: detuned drones with slow swells
    [[110,'sine',.10],[164.81,'triangle',.035],[220.4,'sine',.05],[329.2,'sine',.025],[55,'sine',.08]].forEach(([f,type,g],i)=>{
      const o = ctx.createOscillator(), og = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type = type; o.frequency.value = f; o.detune.value = (i%2?7:-5);
      og.gain.value = g; lfo.frequency.value = .05 + i*.023; lg.gain.value = g*.8;
      lfo.connect(lg); lg.connect(og.gain); o.connect(og); og.connect(this.lp); og.connect(dly);
      o.start(); lfo.start();
    });
    // wind: filtered brown noise
    const len = ctx.sampleRate*4, buf = ctx.createBuffer(1,len,ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + .02*w)/1.02; d[i] = last*3.5; }
    const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = .6;
    const ng = ctx.createGain(); ng.gain.value = .22;
    const wl = ctx.createOscillator(), wlg = ctx.createGain(); wl.frequency.value = .07; wlg.gain.value = 260;
    wl.connect(wlg); wlg.connect(bp.frequency); n.connect(bp); bp.connect(ng); ng.connect(this.lp);
    n.start(); wl.start();
    // sparse chimes
    const scale = [659.25,783.99,880,987.77,1174.66,1318.5];
    const chime = () => {
      if (!this.muted){
        const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = scale[Math.random()*scale.length|0];
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.035,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+3.5);
        o.connect(g); g.connect(this.lp); g.connect(dly); o.start(t); o.stop(t+3.6);
      }
      setTimeout(chime, 1800 + Math.random()*4200);
    };
    chime();
  }
  toggleMute(){
    this.init();
    this.ctx.resume();
    this.muted = !this.muted;
    const t = this.ctx.currentTime, g = this.master.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
    g.linearRampToValueAtTime(this.muted ? 0 : .6, t + (this.muted ? .8 : 2));
    return this.muted;
  }
  muffle(on){
    if (!this.ctx) return;
    const t = this.ctx.currentTime, f = this.lp.frequency;
    f.cancelScheduledValues(t); f.setValueAtTime(f.value,t);
    f.exponentialRampToValueAtTime(on ? 380 : 16000, t + (on ? 1.2 : 1.6));
  }
}
const audio = new Ambient();
const sound = $('sound');
sound.onclick = () => { const muted = audio.toggleMute(); sound.setAttribute('aria-pressed', String(!muted)); };

/* ---------------- Renderer ---------------- */
const mount = document.querySelector('.js-canvas-container');
let renderer;
try { renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'}); }
catch(e){ loader.classList.add('gone'); revealUI(); throw e; }
const DPR = Math.min(devicePixelRatio, MOBILE ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
mount.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, .013);
const camera = new THREE.PerspectiveCamera(MOBILE ? 62 : 52, innerWidth/innerHeight, .1, 400);

/* ---------------- Valley path + terrain ---------------- */
const ctrl = [];
for (let i=0, N=14; i<N; i++){
  const a = i/N*Math.PI*2, R = 300 + 70*Math.sin(a*3+1) + 35*Math.cos(a*5);
  ctrl.push(new THREE.Vector3(Math.cos(a)*R, 0, Math.sin(a)*R));
}
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const L = curve.getLength();
const SAMPLES = 700;
const samp = curve.getSpacedPoints(SAMPLES);

const noise = (x,z) => Math.sin(x*.05)*Math.cos(z*.043)*2.2 + Math.sin(x*.13+z*.09)*.8 + Math.cos(z*.21-x*.07)*.35;
const valleyH = d => d < 60 ? .011*d*d : 39.6 + (d-60)*.6;

let minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
for (const p of samp){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); }
const M = 110; minX-=M; maxX+=M; minZ-=M; maxZ+=M;
const G = MOBILE ? 200 : 256;
const cw = (maxX-minX)/G, ch = (maxZ-minZ)/G;
const H = new Float32Array((G+1)*(G+1));
const sx = new Float32Array(SAMPLES), sz = new Float32Array(SAMPLES);
for (let i=0;i<SAMPLES;i++){ sx[i]=samp[i].x; sz[i]=samp[i].z; }
for (let j=0;j<=G;j++) for (let i=0;i<=G;i++){
  const x = minX + i*cw, z = minZ + j*ch;
  let best = Infinity;
  for (let k=0;k<SAMPLES;k++){ const dx=x-sx[k], dz=z-sz[k], dd=dx*dx+dz*dz; if (dd<best) best=dd; }
  const d = Math.sqrt(best);
  H[j*(G+1)+i] = valleyH(d) + noise(x,z)*Math.min(1, d/12);
}
function heightAt(x,z){
  const fx = THREE.MathUtils.clamp((x-minX)/cw, 0, G-.001), fz = THREE.MathUtils.clamp((z-minZ)/ch, 0, G-.001);
  const i = fx|0, j = fz|0, u = fx-i, v = fz-j, r = G+1;
  const a = H[j*r+i], b = H[j*r+i+1], c = H[(j+1)*r+i], e = H[(j+1)*r+i+1];
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+e*u)*v;
}

// ground mesh (dark, writes depth so hills occlude flowers)
{
  const geo = new THREE.PlaneGeometry(1,1,G,G);
  const pos = geo.attributes.position;
  for (let k=0;k<pos.count;k++){
    const i = k % (G+1), j = (k/(G+1))|0;
    pos.setXYZ(k, minX+i*cw, H[j*(G+1)+i], minZ+j*ch);
  }
  geo.computeVertexNormals();
  const mat = new THREE.ShaderMaterial({
    fog:true,
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog]),
    vertexShader:`#include <fog_pars_vertex>
      varying float vH; varying vec3 vN;
      void main(){ vH=position.y; vN=normal; vec4 mvPosition=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*mvPosition;
      #include <fog_vertex>
      }`,
    fragmentShader:`#include <fog_pars_fragment>
      varying float vH; varying vec3 vN;
      void main(){ float lit=.55+.45*vN.y; vec3 c=mix(vec3(.010,.022,.020),vec3(.006,.010,.016),smoothstep(0.,30.,vH))*lit; gl_FragColor=vec4(c,1.);
      #include <fog_fragment>
      }`
  });
  mat.side = THREE.DoubleSide;
  scene.add(new THREE.Mesh(geo, mat));
}

/* ---------------- Flowers + leaves (point sprites) ---------------- */
const FLOWERS = MOBILE ? 24000 : 52000, LEAVES = MOBILE ? 14000 : 30000, TOTAL = FLOWERS + LEAVES;
const palette = ['#ff5fa2','#ffb3d9','#b07bff','#7fd9ff','#ffd27a','#ff8a5c','#e9f1ff','#8affc8'].map(c=>new THREE.Color(c));
const leafCols = ['#1f6b5a','#2f8f6e','#17504a','#3a7a3c'].map(c=>new THREE.Color(c));
const pArr = new Float32Array(TOTAL*3), cArr = new Float32Array(TOTAL*3), dArr = new Float32Array(TOTAL*4);
const tmpT = new THREE.Vector3();
for (let n=0;n<TOTAL;n++){
  const leaf = n >= FLOWERS;
  const k = Math.random()*SAMPLES|0, f = Math.random();
  const a = samp[k], b = samp[(k+1)%SAMPLES];
  const px = a.x + (b.x-a.x)*f, pz = a.z + (b.z-a.z)*f;
  tmpT.set(b.x-a.x, 0, b.z-a.z).normalize();
  const sign = Math.random() < .5 ? -1 : 1;
  const lat = leaf ? sign*(.5 + Math.random()*72) : sign*(1.3 + Math.pow(Math.random(),1.55)*64);
  const x = px - tmpT.z*lat, z = pz + tmpT.x*lat;
  const y = heightAt(x,z) + (leaf ? .08 + Math.random()*.35 : .35 + Math.random()*1.0);
  pArr.set([x,y,z], n*3);
  let col;
  if (leaf) col = leafCols[Math.random()*leafCols.length|0].clone().multiplyScalar(.55);
  else {
    const patch = (Math.sin(x*.031)+Math.cos(z*.027)+Math.sin((x+z)*.011)+3)/6;
    col = palette[Math.floor(patch*palette.length + Math.random()*1.6) % palette.length].clone();
  }
  cArr.set([col.r,col.g,col.b], n*3);
  dArr.set([leaf ? .45+Math.random()*.55 : .2+Math.random()*.32, Math.random(), leaf?1:0, Math.random()*6.283], n*4);
}
const fGeo = new THREE.BufferGeometry();
fGeo.setAttribute('position', new THREE.BufferAttribute(pArr,3));
fGeo.setAttribute('aColor', new THREE.BufferAttribute(cArr,3));
fGeo.setAttribute('aData', new THREE.BufferAttribute(dArr,4));

const U = {
  uTime:{value:0}, uIntro:{value:0}, uDisperse:{value:0},
  uMouse:{value:new THREE.Vector2(9,9)}, uAspect:{value:innerWidth/innerHeight},
  uScale:{value:1}, uPR:{value:DPR}
};
const fMat = new THREE.ShaderMaterial({
  uniforms:U, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime,uIntro,uDisperse,uAspect,uScale,uPR; uniform vec2 uMouse;
    attribute vec3 aColor; attribute vec4 aData;
    varying vec3 vColor; varying float vAlpha,vType,vSeed,vGlow,vDisp,vRot;
    void main(){
      float seed=aData.y, type=aData.z;
      vec3 p=position;
      p.x+=sin(uTime*1.1+seed*40.+p.z*.12)*.10*(1.-type*.6);
      p.z+=cos(uTime*.8+seed*31.+p.x*.1)*.07;
      // disperse into floating particles
      vec3 dir=normalize(vec3(fract(seed*12.9898)-.5, fract(seed*78.233)*.9+.25, fract(seed*37.719)-.5));
      float dsp=uDisperse*(1.-type*.5);
      p+=dir*dsp*(2.2+seed*6.)+vec3(sin(uTime*.5+seed*13.)*.5, sin(uTime*.6+seed*20.)*.8+1.2, cos(uTime*.45+seed*9.)*.5)*dsp;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      float dist=-mv.z;
      vec4 clip=projectionMatrix*mv;
      // screen-space push away from cursor
      vec2 ndc=clip.xy/clip.w;
      vec2 d=ndc-uMouse; d.x*=uAspect;
      float l=length(d);
      float f=exp(-l*l/.05);
      vec2 push=l>1e-4 ? d/l*f*.085 : vec2(0.);
      push.x/=uAspect;
      clip.xy+=push*clip.w;
      gl_Position=clip;
      // bloom as they approach; leaves grow in further back
      float grow = type<.5 ? mix(.16,1.,smoothstep(115.,16.,dist)) : smoothstep(4.,30.,dist)*mix(1.,.5,smoothstep(60.,150.,dist));
      grow*=smoothstep(seed*.75,seed*.75+.25,uIntro);
      float size=aData.x*grow*mix(1.,.5,uDisperse);
      gl_PointSize=min(size*uScale*uPR/max(dist,.6), 240.*uPR);
      vColor=aColor; vType=type; vSeed=seed; vGlow=f; vDisp=uDisperse; vRot=aData.w+uTime*.05*(seed-.5);
      vAlpha=exp(-dist*.016)*smoothstep(.7,3.,dist)*(type<.5?1.:.6);
    }`,
  fragmentShader:`
    varying vec3 vColor; varying float vAlpha,vType,vSeed,vGlow,vDisp,vRot;
    void main(){
      vec2 uv=gl_PointCoord*2.-1.;
      float c=cos(vRot), s=sin(vRot); uv=mat2(c,-s,s,c)*uv;
      float r=length(uv); if(r>1.) discard;
      vec3 col; float a;
      if(vType<.5){
        float ang=atan(uv.y,uv.x), petals=floor(4.+vSeed*4.);
        float pr=.42+.5*pow(abs(cos(ang*petals*.5)),1.4);
        float petal=smoothstep(pr,pr-.3,r);
        float core=smoothstep(.26,0.,r);
        col=mix(vColor*(.5+.5*r),vec3(1.,.93,.78),core*.6);
        a=petal*.55+core*.7+exp(-r*r*5.)*.12;
      } else {
        vec2 q=uv; q.x*=2.3; float rr=length(q);
        float vein=1.-smoothstep(.0,.06,abs(uv.y))*.3;
        col=vColor*vein; a=smoothstep(1.,.45,rr)*.28;
      }
      float dotA=exp(-r*r*6.)*.9;
      a=mix(a,dotA,vDisp);
      col=mix(col,mix(vColor,vec3(1.),.35)*1.6,vDisp*(1.-vType*.6));
      col*=1.+vGlow*2.2;
      gl_FragColor=vec4(col*a*vAlpha,1.);
    }`
});
const flowers = new THREE.Points(fGeo, fMat);
flowers.frustumCulled = false;
scene.add(flowers);

/* ---------------- Dust ---------------- */
const DUST = MOBILE ? 700 : 1500, DB = 46;
const dPos = new Float32Array(DUST*3), dSeed = new Float32Array(DUST);
for (let i=0;i<DUST;i++){ dPos.set([Math.random()*DB,Math.random()*DB*.5,Math.random()*DB], i*3); dSeed[i]=Math.random(); }
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos,3));
dGeo.setAttribute('aSeed', new THREE.BufferAttribute(dSeed,1));
const dustU = {uTime:U.uTime, uCam:{value:new THREE.Vector3()}, uScale:U.uScale, uPR:U.uPR, uDisperse:U.uDisperse};
const dust = new THREE.Points(dGeo, new THREE.ShaderMaterial({
  uniforms:dustU, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime,uScale,uPR,uDisperse; uniform vec3 uCam; attribute float aSeed; varying float vA;
    void main(){
      float B=${DB.toFixed(1)};
      vec3 p=position+vec3(sin(uTime*.1+aSeed*30.)*2., uTime*(.15+aSeed*.25), cos(uTime*.08+aSeed*20.)*2.);
      vec3 o=uCam-vec3(B*.5,B*.18,B*.5);
      p=mod(p-o,vec3(B,B*.5,B))+o;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_Position=projectionMatrix*mv;
      float d=-mv.z;
      gl_PointSize=(.05+aSeed*.06)*uScale*uPR/max(d,.5)*(1.+uDisperse);
      vA=smoothstep(B*.5,4.,d)*smoothstep(.5,2.,d)*(.4+.6*sin(uTime*1.5+aSeed*50.)*.5+.3);
    }`,
  fragmentShader:`varying float vA; void main(){ float r=length(gl_PointCoord-.5)*2.; gl_FragColor=vec4(vec3(1.,.92,.75)*exp(-r*r*4.)*vA,1.); }`
}));
dust.frustumCulled = false;
scene.add(dust);

/* ---------------- Light rays ---------------- */
{
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'rgba(255,255,255,0)'); grad.addColorStop(.35,'rgba(255,255,255,.9)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0,0,64,256);
  g.globalCompositeOperation = 'destination-in';
  const hg = g.createLinearGradient(0,0,64,0);
  hg.addColorStop(0,'rgba(0,0,0,0)'); hg.addColorStop(.5,'rgba(0,0,0,1)'); hg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = hg; g.fillRect(0,0,64,256);
  const tex = new THREE.CanvasTexture(cv);
  for (let i=0;i<34;i++){
    const k = Math.random()*SAMPLES|0, a = samp[k], b = samp[(k+1)%SAMPLES];
    tmpT.set(b.x-a.x,0,b.z-a.z).normalize();
    const lat = (Math.random()<.5?-1:1)*(8+Math.random()*34);
    const x = a.x - tmpT.z*lat, z = a.z + tmpT.x*lat;
    const m = new THREE.SpriteMaterial({map:tex, color:new THREE.Color().setHSL(.58+Math.random()*.2,.6,.7), transparent:true, opacity:.035+Math.random()*.05, blending:THREE.AdditiveBlending, depthWrite:false, fog:false});
    const sp = new THREE.Sprite(m);
    const sc = 50 + Math.random()*50;
    sp.scale.set(5+Math.random()*9, sc, 1);
    sp.position.set(x, heightAt(x,z) + sc*.32, z);
    scene.add(sp);
  }
}

/* ---------------- Post-processing ---------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), MOBILE ? .55 : .7, .5, .32);
composer.addPass(bloom);
const post = new ShaderPass({
  uniforms:{tDiffuse:{value:null}, uTime:{value:0}, uSplit:{value:.002}, uVig:{value:0}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime,uSplit,uVig; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 c=vUv-.5; vec2 off=c*uSplit;
      float n=hash(vUv*vec2(731.,517.)+floor(uTime*24.));
      off+=vec2(n-.5)*uSplit*.15;
      vec3 col=vec3(texture2D(tDiffuse,vUv+off).r, texture2D(tDiffuse,vUv).g, texture2D(tDiffuse,vUv-off).b);
      col+=(n-.5)*.03;
      float l=length(c*vec2(1.,.9));
      col*=1.-smoothstep(.28-uVig*.12,.88-uVig*.3,l)*.88;
      gl_FragColor=vec4(max(col,0.),1.);
    }`
});
composer.addPass(post);
composer.addPass(new OutputPass());

/* ---------------- Input: virtual scroller + mouse ---------------- */
let target = 0, s = 0, last = 0;
const WHEEL = .012, TOUCH = WHEEL*20;
addEventListener('wheel', e => { target += e.deltaY * (e.deltaMode === 1 ? 16 : 1) * WHEEL; }, {passive:true});
let ty = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, {passive:true});
addEventListener('touchmove', e => { const y = e.touches[0].clientY; if (ty !== null) target += (ty - y) * TOUCH * .25; ty = y; }, {passive:true});
addEventListener('touchend', () => { ty = null; });
addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === ' ') target += 8; if (e.key === 'ArrowUp') target -= 8; });

const mouse = new THREE.Vector2(9,9), mouseS = new THREE.Vector2(0,0), tilt = new THREE.Vector2();
let hasMouse = false;
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  hasMouse = true;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight*2-1));
});
document.addEventListener('pointerleave', () => { hasMouse = false; });

/* ---------------- Hover transition ---------------- */
let hoverTarget = 0, hover = 0;
const startHoverTransition = () => { hoverTarget = 1; audio.muffle(true); };
const stopHoverTransition  = () => { hoverTarget = 0; audio.muffle(false); };
const go = $('go');
go.addEventListener('pointerenter', startHoverTransition);
go.addEventListener('pointerleave', stopHoverTransition);
go.addEventListener('focus', startHoverTransition);
go.addEventListener('blur', stopHoverTransition);

/* ---------------- Resize ---------------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h); composer.setSize(w,h); bloom.setSize(w,h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  U.uAspect.value = w/h;
  U.uScale.value = h / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
}
resize(); addEventListener('resize', resize);

/* ---------------- Loop ---------------- */
const clock = new THREE.Clock();
const P = new THREE.Vector3(), Q = new THREE.Vector3(), look = new THREE.Vector3(), lookS = new THREE.Vector3();
const wrapT = v => (((v % L) + L) % L) / L;
let introStart = -1, introDone = false, speedS = 0, first = true;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  U.uTime.value = t; post.uniforms.uTime.value = t;

  hover += (hoverTarget - hover) * (1 - Math.exp(-dt*2.2));
  const he = ease(THREE.MathUtils.clamp(hover,0,1));
  U.uDisperse.value = he;

  // intro
  let intro = 1, lift = 0;
  if (introStart >= 0){
    const k = Math.min((t - introStart)/4.2, 1);
    intro = k; lift = (1 - ease(k)) * 24;
    U.uIntro.value = Math.min(k*1.25, 1);
    if (k >= 1 && !introDone){ introDone = true; revealUI(); }
  } else { lift = 24; U.uIntro.value = 0; }

  // flight
  const flying = 1 - he;
  target += dt * (REDUCE ? .35 : 1.4) * flying * (introStart >= 0 ? intro : 0);
  target -= (target - s) * he * Math.min(dt*3, 1);
  const prev = s;
  s += (target - s) * (1 - Math.exp(-dt*2.4)) * flying;
  const speed = Math.abs(s - prev) / Math.max(dt, 1e-4);
  speedS += (speed - speedS) * (1 - Math.exp(-dt*4));
  const sp = THREE.MathUtils.clamp((speedS - 1.5)/18, 0, 1);
  post.uniforms.uVig.value = sp;
  post.uniforms.uSplit.value = .0018 + sp*.007 + he*.002;

  curve.getPointAt(wrapT(s), P);
  curve.getPointAt(wrapT(s + 14), Q);
  camera.position.set(P.x, heightAt(P.x,P.z) + 2.5 + lift, P.z);

  // mouse
  mouseS.lerp(hasMouse ? mouse : new THREE.Vector2(0,0), 1 - Math.exp(-dt*5));
  U.uMouse.value.copy(hasMouse ? mouseS : new THREE.Vector2(9,9));
  tilt.lerp(hasMouse ? mouse : new THREE.Vector2(0,0), 1 - Math.exp(-dt*2));
  tmpT.subVectors(Q,P).normalize();
  look.set(Q.x - tmpT.z*tilt.x*-3.2, heightAt(Q.x,Q.z) + 2.0 + tilt.y*1.6 - lift*.25, Q.z + tmpT.x*tilt.x*-3.2);
  if (first){ lookS.copy(look); first = false; } else lookS.lerp(look, 1 - Math.exp(-dt*6));
  camera.lookAt(lookS);

  dustU.uCam.value.copy(camera.position);
  composer.render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// loaded: first frame drawn + fonts ready
Promise.all([document.fonts ? document.fonts.ready : 0, new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))]).then(() => {
  loader.classList.add('gone');
  introStart = clock.elapsedTime + .3;
});
// safety: never leave the UI hidden
setTimeout(revealUI, 9000);

window.valley = {startHoverTransition, stopHoverTransition};
</script>
</body>
